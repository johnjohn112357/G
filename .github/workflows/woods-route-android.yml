name: Woods Route Planner Android APK

on:
  workflow_dispatch:
  push:
    branches: [woods-route-planner]
    paths:
      - "woods-route/android/**"
      - ".github/workflows/woods-route-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: woods-route/android
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle --version
          gradle --no-daemon assembleDebug --stacktrace --info 2>&1 | tee android-build.log
          status=${PIPESTATUS[0]}
          grep -n -E "(^e: |error:|Unresolved reference|Compilation error)" android-build.log || true
          exit "$status"
      - name: Rename APK
        run: cp woods-route/android/app/build/outputs/apk/debug/app-debug.apk WoodsRoutePlanner-Android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WoodsRoutePlanner-Android-APK
          path: WoodsRoutePlanner-Android.apk
          if-no-files-found: error
          retention-days: 90
