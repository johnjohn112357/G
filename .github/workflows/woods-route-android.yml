name: Woods Route Planner Android APK

on:
  workflow_dispatch:
  push:
    branches: [woods-route-planner]
    paths:
      - "woods-route/android/**"
      - ".github/workflows/woods-route-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: woods-route/android
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle --version
          gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp woods-route/android/app/build/outputs/apk/debug/app-debug.apk WoodsRoutePlanner-Android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WoodsRoutePlanner-Android-APK
          path: WoodsRoutePlanner-Android.apk
          if-no-files-found: error
          retention-days: 90
