name: Render keep-warm probe

on:
  schedule:
    # Render free web services may sleep after 15 minutes without inbound traffic.
    # GitHub scheduled workflows are best-effort, so this reduces cold starts but
    # cannot guarantee the service is always awake.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keep-warm
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request public health endpoint
        run: |
          curl --fail --silent --show-error --location \
            --max-time 60 \
            --retry 2 --retry-delay 5 \
            https://research-engineering-toolkit.onrender.com/health
