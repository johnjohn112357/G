services:
  toolkit:
    build: .
    container_name: research-engineering-toolkit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8765"
      DB_PATH: /data/toolkit.sqlite3
    volumes:
      - toolkit-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  toolkit-data:
